name: Compilar CachyMedia Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Motores (Flet y yt-dlp)
        run: |
          python -m pip install --upgrade pip
          pip install flet yt-dlp pyinstaller pillow

      - name: Descargar motor de video (FFmpeg)
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp"
          Move-Item -Path "ffmpeg_temp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "ffmpeg.exe"

      - name: Empaquetar a .exe
        run: flet pack main.py --name "CachyMedia" --icon "icono.png"

      - name: Preparar Carpeta Final
        run: |
          mkdir CachyMedia_Windows
          Move-Item -Path "dist\CachyMedia.exe" -Destination "CachyMedia_Windows\"
          Move-Item -Path "ffmpeg.exe" -Destination "CachyMedia_Windows\"

      - name: Subir Archivo Terminado
        uses: actions/upload-artifact@v4
        with:
          name: CachyMedia-Windows
          path: CachyMedia_Windows/
