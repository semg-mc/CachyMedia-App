name: Compilar CachyMedia Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Motores (Versiones Congeladas)
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.21.2 yt-dlp pyinstaller==6.9.0 pillow

      - name: Empaquetar a .exe
        run: flet pack main.py --name "CachyMedia" --icon "icono.png"

      - name: Preparar Carpeta Final
        run: |
          mkdir CachyMedia_Windows
          Move-Item -Path "dist\CachyMedia.exe" -Destination "CachyMedia_Windows\"

      - name: Subir Archivo Terminado
        uses: actions/upload-artifact@v4
        with:
          name: CachyMedia-Windows
          path: CachyMedia_Windows/
